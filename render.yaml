# Render Blueprint: deploys the business website example as a free static site.
services:
  - type: web
    runtime: static
    name: nexora-digital
    branch: add-business-site-example
    rootDir: apps/example-business-site
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
